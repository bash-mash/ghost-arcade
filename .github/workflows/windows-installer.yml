name: Windows Installer (unsigned)

# Builds an unsigned NSIS installer for this fork and attaches it to the run
# as a downloadable artifact. Uses electron-builder.local.yml, which disables
# the upstream Azure signing (no credentials needed) and never publishes.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install native addon dependencies
        run: npm ci --ignore-scripts
        working-directory: electron/native

      - name: Build native addons
        run: npm run build -- --rebuild
        working-directory: electron/native

      - name: Build frontend
        run: npm run build

      - name: Build Electron (Windows NSIS, unsigned)
        run: npx electron-builder --win nsis -c electron-builder.local.yml --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Ghost-Arcade-Windows-Installer
          path: dist-electron/*.exe
          if-no-files-found: error
